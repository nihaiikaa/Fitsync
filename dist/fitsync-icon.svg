<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12151B"/>
      <stop offset="100%" stop-color="#0A0B0E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10E567"/>
      <stop offset="100%" stop-color="#0BB84F"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#222731" stroke-width="4"/>

  <!-- FitSync Dumbbell / Sync Logo -->
  <g transform="translate(96, 96)" filter="url(#glow)">
    <!-- Dumbbell Bar -->
    <rect x="80" y="148" width="160" height="24" rx="12" fill="#FFFFFF"/>
    
    <!-- Left Weight Plates -->
    <rect x="44" y="110" width="28" height="100" rx="10" fill="url(#accent)"/>
    <rect x="16" y="125" width="22" height="70" rx="8" fill="url(#accent)"/>
    
    <!-- Right Weight Plates -->
    <rect x="248" y="110" width="28" height="100" rx="10" fill="url(#accent)"/>
    <rect x="282" y="125" width="22" height="70" rx="8" fill="url(#accent)"/>

    <!-- Pulse / Sync Rings -->
    <circle cx="160" cy="160" r="140" fill="none" stroke="url(#accent)" stroke-width="8" stroke-dasharray="24 16" opacity="0.65"/>
    <polygon points="280,70 305,50 305,90" fill="#10E567"/>
    <polygon points="40,250 15,270 15,230" fill="#10E567"/>
  </g>
</svg>
