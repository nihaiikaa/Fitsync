server:
  port: -1

spring:
  datasource:
    url: jdbc:h2:mem:fitsync_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: false

app:
  jwt:
    secret: fitsync_super_secret_jwt_encryption_key_2026_test_grade_32_chars_minimum
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:3000
